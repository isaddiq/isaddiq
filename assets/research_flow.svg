    <text x="930" y="145" fill="white" font-size="19" font-weight="700">Robotic Systems</text>
    <text x="930" y="175" fill="#E9D5FF" font-size="14">Inspection · HRC</text>
  </g>

  <g>
    <rect x="1035" y="125" width="125" height="70" rx="18" fill="#1E3A8A" stroke="#93C5FD" stroke-width="2" filter="url(#glow)"/>
    <text x="1097" y="153" fill="white" font-size="16" font-weight="700">Intelligent</text>
    <text x="1097" y="176" fill="white" font-size="16" font-weight="700">Built Assets</text>
  </g>
</g>

<g stroke="#60A5FA" stroke-width="3" fill="none" marker-end="url(#arrow)">
  <path d="M245 160 H305"/>
  <path d="M505 160 H565"/>
  <path d="M765 160 H825"/>
  <path d="M1025 160 H1030"/>
</g>

<circle cx="275" cy="160" r="6" fill="#93C5FD">
