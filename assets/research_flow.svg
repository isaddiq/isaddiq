<svg width="1200" height="330" viewBox="0 0 1200 330" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
    <path d="M0,0 L0,6 L9,3 z" fill="#60A5FA"/>
  </marker>
  <filter id="glow">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<rect width="1200" height="330" rx="22" fill="#0F172A"/>

<g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
  <g>
    <rect x="55" y="105" width="190" height="110" rx="18" fill="#172554" stroke="#60A5FA" stroke-width="2"/>
    <text x="150" y="145" fill="white" font-size="19" font-weight="700">Built Environment</text>
    <text x="150" y="175" fill="#BFDBFE" font-size="14">BIM · IFC · Assets</text>
  </g>

  <g>
    <rect x="315" y="105" width="190" height="110" rx="18" fill="#0C4A6E" stroke="#38BDF8" stroke-width="2"/>
    <text x="410" y="145" fill="white" font-size="19" font-weight="700">Sensing &amp; XR</text>
    <text x="410" y="175" fill="#BAE6FD" font-size="14">Reality Capture · MR</text>
  </g>

  <g>
    <rect x="575" y="105" width="190" height="110" rx="18" fill="#312E81" stroke="#818CF8" stroke-width="2"/>
    <text x="670" y="145" fill="white" font-size="19" font-weight="700">AI &amp; Semantics</text>
    <text x="670" y="175" fill="#C7D2FE" font-size="14">LLMs · Knowledge · DT</text>
  </g>

  <g>
