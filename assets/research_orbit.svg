<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&amp;family=Fira+Code:wght@400&amp;display=swap');
      .core-title {
        font-family: 'Outfit', sans-serif;
        font-weight: 700;
        font-size: 16px;
        fill: #ffffff;
        text-anchor: middle;
      }
      .core-subtitle {
        font-family: 'Fira Code', monospace;
        font-size: 10px;
        fill: #9B72CF;
        text-anchor: middle;
      }
      .node-title {
        font-family: 'Outfit', sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #ffffff;
      }
      .node-desc {
        font-family: 'Outfit', sans-serif;
        font-weight: 300;
        font-size: 11px;
        fill: #a0aec0;
      }
      .orbit-ring {
        fill: none;
        stroke: #252147;
        stroke-width: 1.5;
        stroke-dasharray: 4 8;
        transform-origin: 400px 175px;
      }
      .orbit-1 { animation: rotateCw 35s linear infinite; }
      .orbit-2 { animation: rotateCcw 45s linear infinite; }
      .orbit-3 { animation: rotateCw 60s linear infinite; }
      
      .data-stream {
        fill: none;
        stroke-width: 1.5;
        stroke-dasharray: 6 12;
        animation: streamFlow 4s linear infinite;
      }
      
      .pulse-circle {
        transform-origin: center;
        animation: pulseGlow 3s ease-in-out infinite;
      }
      
      .orbit-node {
        transition: all 0.3s ease;
      }
      .orbit-node:hover {
        cursor: pointer;
        filter: brightness(1.2) drop-shadow(0 0 10px var(--node-color));
      }
      
      @keyframes rotateCw {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes rotateCcw {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes streamFlow {
        from { stroke-dashoffset: 36; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes pulseGlow {
        0%, 100% { transform: scale(1); opacity: 0.4; }
        50% { transform: scale(1.15); opacity: 0.8; }
      }
    </style>
    
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0f0c24" />
      <stop offset="60%" stop-color="#070612" />
      <stop offset="100%" stop-color="#030308" />
    </radialGradient>
    
    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9B72CF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#9B72CF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="10"/>

  <!-- Concentric Orbit Rings (Background Decoration) -->
  <circle cx="400" cy="175" r="70" class="orbit-ring orbit-1" />
  <circle cx="400" cy="175" r="140" class="orbit-ring orbit-2" />
  <circle cx="400" cy="175" r="210" class="orbit-ring orbit-3" />

  <!-- Animated Data Streams (Radial Lines) -->
  <!-- To AI Design Automation (Top) -->
  <line x1="400" y1="175" x2="400" y2="60" class="data-stream" stroke="#FF6B35" />
  <!-- To BIM-XR Integration (Top Right) -->
  <line x1="400" y1="175" x2="570" y2="105" class="data-stream" stroke="#0078D4" style="animation-delay: 0.8s;" />
  <!-- To 4D Simulation (Bottom Right) -->
  <line x1="400" y1="175" x2="505" y2="275" class="data-stream" stroke="#FFD23F" style="animation-delay: 1.6s;" />
  <!-- To Digital Twin (Bottom Left) -->
  <line x1="400" y1="175" x2="295" y2="275" class="data-stream" stroke="#00D084" style="animation-delay: 2.4s;" />
  <!-- To Mixed Reality (Top Left) -->
  <line x1="400" y1="175" x2="230" y2="105" class="data-stream" stroke="#E51050" style="animation-delay: 3.2s;" />

  <!-- Central Digital Twin Core -->
  <g transform="translate(400, 175)">
    <!-- Glow -->
    <circle cx="0" cy="0" r="55" fill="url(#core-glow)" class="pulse-circle"/>
    <circle cx="0" cy="0" r="40" fill="#14112e" stroke="#9B72CF" stroke-width="2"/>
    <circle cx="0" cy="0" r="30" fill="none" stroke="#0078D4" stroke-width="1" stroke-dasharray="4 4" class="orbit-1"/>
    <!-- Central Icon/Symbol -->
    <path d="M-8,-8 L8,8 M8,-8 L-8,8 M0,-11 L0,11 M-11,0 L11,0" stroke="#00D084" stroke-width="1.5" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>
    </path>
    <text x="0" y="4" class="core-title">RESEARCH</text>
    <text x="0" y="16" class="core-subtitle">CORE</text>
  </g>

  <!-- Node 1: AI Design Automation (Top) -->
  <g class="orbit-node" style="--node-color: #FF6B35;">
    <circle cx="400" cy="60" r="8" fill="#FF6B35"/>
    <circle cx="400" cy="60" r="14" fill="none" stroke="#FF6B35" stroke-width="1" opacity="0.5">
      <animate attributeName="r" values="8;18;8" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="418" y="58" class="node-title">AI Design Automation</text>
    <text x="418" y="73" class="node-desc">Generative design &amp; layout automation</text>
  </g>

  <!-- Node 2: BIM-XR Integration (Top Right) -->
  <g class="orbit-node" style="--node-color: #0078D4;">
    <circle cx="570" cy="105" r="8" fill="#0078D4"/>
    <circle cx="570" cy="105" r="14" fill="none" stroke="#0078D4" stroke-width="1" opacity="0.5">
      <animate attributeName="r" values="8;18;8" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <text x="588" y="103" class="node-title">BIM-XR Integration</text>
    <text x="588" y="118" class="node-desc">BIMUniXchange semantic data exchange</text>
  </g>

  <!-- Node 3: 4D BIM Simulation (Bottom Right) -->
  <g class="orbit-node" style="--node-color: #FFD23F;">
    <circle cx="505" cy="275" r="8" fill="#FFD23F"/>
    <circle cx="505" cy="275" r="14" fill="none" stroke="#FFD23F" stroke-width="1" opacity="0.5">
      <animate attributeName="r" values="8;18;8" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="3s" repeatCount="indefinite"/>
    </circle>
    <text x="523" y="273" class="node-title">4D BIM Simulation</text>
    <text x="523" y="288" class="node-desc">Construction scheduling &amp; sequence VR</text>
  </g>

  <!-- Node 4: Digital Twin Frameworks (Bottom Left) -->
  <g class="orbit-node" style="--node-color: #00D084;" transform="translate(0, 0)">
    <circle cx="295" cy="275" r="8" fill="#00D084"/>
    <circle cx="295" cy="275" r="14" fill="none" stroke="#00D084" stroke-width="1" opacity="0.5">
      <animate attributeName="r" values="8;18;8" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <!-- Left-aligned text -->
    <text x="277" y="273" class="node-title" text-anchor="end">Digital Twins &amp; DfMA</text>
    <text x="277" y="288" class="node-desc" text-anchor="end">Prefabrication tracking &amp; sensor grids</text>
  </g>

  <!-- Node 5: Mixed Reality Inspection (Top Left) -->
  <g class="orbit-node" style="--node-color: #E51050;">
    <circle cx="230" cy="105" r="8" fill="#E51050"/>
    <circle cx="230" cy="105" r="14" fill="none" stroke="#E51050" stroke-width="1" opacity="0.5">
      <animate attributeName="r" values="8;18;8" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <!-- Left-aligned text -->
    <text x="212" y="103" class="node-title" text-anchor="end">Mixed Reality Inspection</text>
    <text x="212" y="118" class="node-desc" text-anchor="end">Voice AI assistant on HoloLens 2</text>
  </g>
</svg>
